<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<style>/* Markdown Word — Webview 样式（对齐需求文档 UI-01/UI-09 视觉规范）
   - Ribbon 恒定两行（页签行 ~34px + 图标工具行 ~42px）
   - 主题跟随 VS Code（--vscode-* 变量）
   - 正文 = 西文+中文组合字体栈；代码 = 独立等宽字体（F02/F09） */

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #app { height: 100%; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', var(--vscode-font-family, sans-serif);
  font-size: 13px;
  color: var(--vscode-editor-foreground, #1e293b);
  background: var(--vscode-editor-background, #fff);
}
#app { display: flex; flex-direction: column; }

/* ============ Ribbon：第 1 行 页签 ============ */
#ribbon { border-bottom: 1px solid var(--vscode-panel-border, #e2e8f0); background: var(--vscode-panel-background, #fafbfc); flex: none; }
#rtabs { display: flex; gap: 2px; padding: 4px 12px 0; border-bottom: 1px solid var(--vscode-panel-border, #e8ecf2); }
.rtab {
  padding: 6px 14px; font-size: 12.5px; cursor: pointer; position: relative; user-select: none;
  color: var(--vscode-foreground, #5b6776); border-radius: 6px 6px 0 0;
}
.rtab:hover { background: var(--vscode-list-hoverBackground, rgba(128,128,128,.08)); }
.rtab.active { color: var(--vscode-focusBorder, #4f46e5); font-weight: 600; }
.rtab.active::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2.5px;
  background: var(--vscode-focusBorder, #4f46e5); border-radius: 3px;
}

/* ============ Ribbon：第 2 行 图标工具行 ============ */
.rpanel { display: none; align-items: center; padding: 4px 10px 2px; overflow-x: auto; }
.rpanel.active { display: flex; }
.rgroup { display: flex; flex-direction: column; padding: 0 10px; border-right: 1px solid var(--vscode-panel-border, #eef1f6); flex: none; }
.rgroup:last-child { border-right: none; }
.rrow { display: flex; align-items: center; gap: 2px; }
.rlabel { font-size: 10px; color: var(--vscode-descriptionForeground, #94a3b8); text-align: center; padding-top: 3px; letter-spacing: .04em; }
.rbtn {
  min-width: 30px; height: 28px; padding: 0 5px; border: none; border-radius: 6px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 3px;
  background: transparent; color: var(--vscode-editor-foreground, #334155); font-size: 12px;
}
.rbtn:hover { background: var(--vscode-list-hoverBackground, #eef2ff); }
.rbtn.on { background: var(--vscode-list-activeSelectionBackground, #e0e7ff); color: var(--vscode-list-activeSelectionForeground, #3730a3); }
.rbtn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.rbtn .tchar { font-weight: 700; font-size: 13px; }
.rbtn b { font-weight: 800; }
.rsep { width: 1px; height: 20px; background: var(--vscode-panel-border, #e8ecf2); margin: 0 3px; flex: none; }
.fddl {
  border: 1px solid var(--vscode-dropdown-border, #cbd5e1); border-radius: 6px; padding: 3px 8px; font-size: 11px;
  background: var(--vscode-dropdown-background, #fff); color: var(--vscode-dropdown-foreground, #334155); white-space: nowrap;
}

/* ============ 主区：纸张编辑区 ============ */
#main { flex: 1; display: flex; min-height: 0; background: var(--vscode-editorGroup-background, #e9edf3); }
#editorWrap { flex: 1; overflow: auto; position: relative; }
#editor {
  max-width: 760px; margin: 24px auto 60px; padding: 48px 56px; min-height: 60%;
  background: var(--vscode-editor-background, #fff); color: var(--vscode-editor-foreground, #1e293b);
  box-shadow: 0 2px 12px rgba(0,0,0,.14); border-radius: 3px; outline: none;
  font-size: 15px; line-height: 1.75;
  font-family: 'Segoe UI', 'Microsoft YaHei', var(--vscode-editor-font-family, sans-serif);
}
body.vscode-dark #editor { box-shadow: 0 2px 12px rgba(0,0,0,.5); }

/* 块级样式 */
#editor h1, #editor h2, #editor h3, #editor h4, #editor h5, #editor h6 { margin: 18px 0 8px; line-height: 1.4; }
#editor h1 { font-size: 1.8em; border-bottom: 1px solid var(--vscode-panel-border, #e2e8f0); padding-bottom: 8px; }
#editor h2 { font-size: 1.45em; } #editor h3 { font-size: 1.22em; }
#editor h4 { font-size: 1.1em; } #editor h5 { font-size: 1em; } #editor h6 { font-size: .92em; color: var(--vscode-descriptionForeground, #64748b); }
#editor p { margin: 8px 0; }
#editor blockquote {
  border-left: 3px solid var(--vscode-focusBorder, #4f46e5); background: rgba(79,70,229,.07);
  padding: 6px 14px; margin: 12px 0; border-radius: 0 6px 6px 0; color: var(--vscode-descriptionForeground, #475569);
}
#editor blockquote p { margin: 4px 0; }
#editor ul, #editor ol { padding-left: 26px; margin: 8px 0; }
#editor li { margin: 3px 0; }
#editor li.md-task { list-style: none; display: flex; gap: 8px; align-items: baseline; margin-left: -18px; }
#editor .md-check { cursor: pointer; user-select: none; color: var(--vscode-focusBorder, #4f46e5); font-size: 1.05em; flex: none; }
#editor li.md-task[data-checked="true"] .li-body { color: var(--vscode-descriptionForeground, #94a3b8); text-decoration: line-through; }
#editor hr { border: none; border-top: 1.5px dashed var(--vscode-panel-border, #cbd5e1); margin: 18px 0; }
#editor a { color: var(--vscode-textLink-foreground, #4f46e5); }
#editor img { max-width: 100%; border-radius: 4px; display: block; margin: 8px auto; }
#editor mark { background: #fde047; color: inherit; padding: 0 3px; border-radius: 2px; }
#editor del { color: var(--vscode-descriptionForeground, #94a3b8); }

/* 代码块：恒为独立等宽字体（F09） */
#editor pre, .codebox pre, #preview pre, #sourcePreview pre {
  position: relative; background: var(--vscode-textCodeBlock-background, #0f172a); color: var(--vscode-editor-foreground, #e2e8f0);
  border-radius: 8px; margin: 12px 0; overflow: hidden;
}
#editor pre code, #preview pre code { display: block; padding: 12px 14px; overflow-x: auto; }
#editor code, #preview code {
  font-family: Consolas, 'Courier New', 'Sarasa Mono SC', monospace; font-size: .86em;
}
#editor :not(pre) > code, #preview :not(pre) > code {
  background: rgba(127,127,127,.14); border-radius: 4px; padding: 1px 5px;
}
.code-tools {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: rgba(127,127,127,.15); padding: 2px 8px; font-size: 11px; border-radius: 8px 8px 0 0;
}
.code-tools select {
  border: 1px solid var(--vscode-dropdown-border, transparent); background: transparent; color: inherit;
  font-size: 11px; border-radius: 4px; padding: 1px 2px; outline: none;
}
.code-tools option { color: #334155; }
.code-copy { cursor: pointer; opacity: .7; background: none; border: none; color: inherit; font-size: 11px; }
.code-copy:hover { opacity: 1; }
pre + * { }

/* 表格 */
#editor table, #preview table { border-collapse: collapse; margin: 12px 0; }
#editor th, #editor td, #preview th, #preview td {
  border: 1px solid var(--vscode-panel-border, #cbd5e1); padding: 5px 12px; min-width: 40px;
}
/* 空单元格撑高（零宽字符伪元素）：保证空 td 可点击、可定位光标；伪元素不进入序列化 */
#editor td:empty::before, #editor th:empty::before { content: '\200b'; }
#editor th, #preview th { background: rgba(127,127,127,.1); font-weight: 600; }
#editor th[data-align="left"], #editor td[data-align="left"], #preview [data-align="left"] { text-align: left; }
#editor th[data-align="center"], #editor td[data-align="center"], #preview [data-align="center"] { text-align: center; }
#editor th[data-align="right"], #editor td[data-align="right"], #preview [data-align="right"] { text-align: right; }
#editor .cell-cur { outline: 2px solid var(--vscode-focusBorder, #4f46e5); outline-offset: -2px; border-radius: 2px; }
.md-raw-html { opacity: .9; }

/* ============ 表格浮动工具条（UI-01⑤） ============ */
#ttBar {
  position: absolute; display: none; z-index: 30; background: var(--vscode-editor-background, #fff);
  border: 1px solid var(--vscode-panel-border, #dfe4ec); border-radius: 9px; box-shadow: 0 8px 24px rgba(15,23,42,.22);
  padding: 3px; gap: 1px; align-items: center;
}
#ttBar .rbtn { height: 24px; min-width: 26px; font-size: 11px; }
#ttBar .danger { color: #dc2626; }

/* ============ 斜杠菜单（UI-03，Confluence 式） ============ */
#slashMenu {
  position: absolute; z-index: 60; width: 340px; max-width: calc(100vw - 12px); max-height: 340px; display: none; flex-direction: column;
  background: var(--vscode-editorWidget-background, #fff); color: var(--vscode-editorWidget-foreground, #1e293b);
  border: 1px solid var(--vscode-widget-border, #e2e8f0); border-radius: 10px;
  box-shadow: 0 16px 44px rgba(15,23,42,.28); overflow: hidden;
}
#slashList { list-style: none; overflow-y: auto; padding: 5px; }
#slashList .sgroup { font-size: 10px; color: var(--vscode-descriptionForeground, #94a3b8); padding: 7px 10px 2px; letter-spacing: .08em; font-weight: 700; }
#slashList .sitem { display: flex; gap: 10px; padding: 6px 9px; border-radius: 7px; cursor: pointer; align-items: center; }
#slashList .sitem .sic {
  width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; flex: none;
  background: rgba(127,127,127,.12); font-size: 13px; font-weight: 700;
}
#slashList .sitem .sic.ai { background: rgba(124,58,237,.14); color: #7c3aed; }
#slashList .sitem .sit { font-size: 13px; font-weight: 600; }
#slashList .sitem .sid { font-size: 11px; color: var(--vscode-descriptionForeground, #94a3b8); }
#slashList .sitem.active { background: var(--vscode-list-activeSelectionBackground, #eef2ff); color: var(--vscode-list-activeSelectionForeground, #3730a3); }
#slashList .sitem kbd { margin-left: auto; }
#slashHint {
  border-top: 1px solid var(--vscode-panel-border, #e2e8f0); padding: 6px 12px; font-size: 10.5px;
  color: var(--vscode-descriptionForeground, #94a3b8); display: flex; gap: 12px; background: rgba(127,127,127,.05);
}
kbd {
  background: rgba(127,127,127,.12); border: 1px solid var(--vscode-panel-border, #cbd5e1); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 5px; font-size: 10.5px; font-family: inherit;
}

/* ============ 表格网格选择器（UI-02①） ============ */
#tablePicker {
  position: absolute; z-index: 70; width: 240px; max-width: calc(100vw - 12px); display: none;
  background: var(--vscode-editorWidget-background, #fff); border: 1px solid var(--vscode-widget-border, #e2e8f0);
  border-radius: 10px; box-shadow: 0 16px 44px rgba(15,23,42,.26); padding: 12px;
}
#tpLabel { text-align: center; font-size: 12px; margin-bottom: 8px; color: var(--vscode-descriptionForeground, #334155); font-weight: 600; }
#tpGrid { display: grid; grid-template-columns: repeat(8, 24px); gap: 3px; justify-content: center; }
#tpGrid .cell { width: 24px; height: 18px; border: 1px solid var(--vscode-panel-border, #cbd5e1); border-radius: 3px; cursor: pointer; }
#tpGrid .cell.on { background: var(--vscode-focusBorder, #4f46e5); border-color: var(--vscode-focusBorder, #4f46e5); }
#tpCustom { margin-top: 9px; text-align: center; font-size: 11.5px; color: var(--vscode-textLink-foreground, #4f46e5); cursor: pointer; }

/* ============ 对话框（UI-05） ============ */
.dlgMask { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 100; display: none; align-items: center; justify-content: center; }
.dlg {
  width: 420px; max-width: 92vw; background: var(--vscode-editorWidget-background, #fff);
  border: 1px solid var(--vscode-widget-border, #d5dce6); border-radius: 12px; box-shadow: 0 20px 50px rgba(15,23,42,.3); overflow: hidden;
}
.dlg h3 { font-size: 14px; padding: 13px 18px; border-bottom: 1px solid var(--vscode-panel-border, #e2e8f0); }
.dlg .body { padding: 14px 18px; }
.dlg .foot { padding: 12px 18px; border-top: 1px solid var(--vscode-panel-border, #e2e8f0); display: flex; justify-content: flex-end; gap: 8px; background: rgba(127,127,127,.04); }
.frow { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.frow label { width: 78px; font-size: 12px; color: var(--vscode-descriptionForeground, #475569); flex: none; text-align: right; }
.frow input, .frow select {
  flex: 1; border: 1px solid var(--vscode-input-border, #cbd5e1); border-radius: 6px; padding: 6px 10px;
  background: var(--vscode-input-background, #fff); color: var(--vscode-input-foreground, #1e293b); font: inherit; font-size: 12.5px; outline: none;
}
.btn {
  border: 1px solid var(--vscode-button-border, #cbd5e1); background: var(--vscode-button-secondaryBackground, #fff);
  color: var(--vscode-button-secondaryForeground, #334155); border-radius: 7px; padding: 6px 16px; font: inherit; font-size: 12.5px; cursor: pointer;
}
.btn:hover { background: var(--vscode-list-hoverBackground, #f8fafc); }
.btn.pri { background: var(--vscode-button-background, #4f46e5); border-color: transparent; color: var(--vscode-button-foreground, #fff); }
.btn.pri:hover { background: var(--vscode-button-hoverBackground, #4338ca); }

/* ============ Emoji 面板（UI-03 右） ============ */
#emojiPanel {
  position: absolute; z-index: 80; width: 264px; max-width: calc(100vw - 12px); display: none;
  background: var(--vscode-editorWidget-background, #fff); border: 1px solid var(--vscode-widget-border, #e2e8f0);
  border-radius: 10px; box-shadow: 0 16px 44px rgba(15,23,42,.26); padding: 10px;
}
#emojiPanel .etitle { font-size: 10.5px; color: var(--vscode-descriptionForeground, #94a3b8); font-weight: 700; margin-bottom: 5px; }
#emojiRecent { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin-bottom: 8px; }
#emojiGrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; max-height: 170px; overflow-y: auto; }
#emojiGrid span, #emojiRecent span { font-size: 17px; text-align: center; cursor: pointer; border-radius: 5px; padding: 2px 0; }
#emojiGrid span:hover, #emojiRecent span:hover { background: var(--vscode-list-hoverBackground, #eef2ff); }
#emojiSearch { width: 100%; margin-bottom: 8px; border: 1px solid var(--vscode-input-border, #cbd5e1); border-radius: 6px; padding: 4px 8px; background: var(--vscode-input-background, #fff); color: var(--vscode-input-foreground, inherit); font: inherit; font-size: 12px; outline: none; }

/* ============ 源码 / 分屏模式 ============ */
/* 纸张宽度变量由 JS 设置在 #main 上：所见即所得纸张与源码模式纸张共用，保证两种模式尺寸一致 */
#editor { max-width: var(--page-width, 760px); }
#sourceArea { display: none; flex-direction: column; min-width: 0; }
#sourceArea.active { display: flex; }
#sourceArea.grow { flex: 1; }
#sourceHint {
  flex: none; display: flex; align-items: center; gap: 10px; padding: 4px 16px; font-size: 11px;
  color: var(--vscode-descriptionForeground, #64748b); background: rgba(127,127,127,.07);
  border-bottom: 1px solid var(--vscode-panel-border, rgba(127,127,127,.12));
}
#sourceHint a { color: var(--vscode-textLink-foreground, #4f46e5); cursor: pointer; text-decoration: none; }
#sourceHint a:hover { text-decoration: underline; }
#srcTextarea {
  flex: 1; resize: none; border: none; outline: none; padding: 20px 24px;
  font-family: Consolas, 'Courier New', monospace; font-size: 14px; line-height: 1.7; tab-size: 2;
  background: var(--vscode-input-background, #fff); color: var(--vscode-input-foreground, #1e293b);
}
/* 纯源码模式：源码区按页面纸张宽度居中，与所见即所得视觉一致（分屏模式保持半宽自适应） */
body.source #srcCol {
  max-width: var(--page-width, 760px); width: calc(100% - 32px);
  margin: 24px auto 60px; display: flex; flex-direction: column; min-width: 0;
  background: var(--vscode-editor-background, #fff);
  border-radius: 3px; box-shadow: 0 2px 12px rgba(0,0,0,.14); overflow: hidden;
}
body.vscode-dark.source #srcCol { box-shadow: 0 2px 12px rgba(0,0,0,.5); }
body.source #srcTextarea { background: transparent; padding: 32px 40px; }
#preview { display: none; flex: 1; overflow: auto; padding: 20px 24px; border-left: 1px solid var(--vscode-panel-border, #e2e8f0); }
#preview.active { display: block; }
#preview .pv-inner { max-width: 760px; margin: 0 auto; font-size: 15px; line-height: 1.75; }
#preview h1, #preview h2 { border-bottom: 1px solid var(--vscode-panel-border, #e2e8f0); padding-bottom: 6px; margin: 18px 0 8px; }
#preview h1 { font-size: 1.7em; } #preview h2 { font-size: 1.4em; }
#preview blockquote { border-left: 3px solid var(--vscode-focusBorder, #4f46e5); padding: 4px 12px; margin: 10px 0; color: var(--vscode-descriptionForeground, #475569); }
#preview ul, #preview ol { padding-left: 24px; margin: 8px 0; }
#preview li { margin: 3px 0; }
#preview li.md-task { list-style: none; margin-left: -16px; }
#preview img { max-width: 100%; }
#preview table { width: 100%; }
body.split #editorWrap { display: none; }
body.split #sourceArea { display: flex; flex-direction: row; }
body.split #srcCol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
body.split #preview { display: block; }
body.source #editorWrap { display: none; }
body.source #sourceArea { display: flex; }
body.source #preview { display: none; }

/* ============ 状态栏 ============ */
#statusBar {
  flex: none; display: flex; align-items: center; height: 26px; font-size: 11.5px; user-select: none;
  background: var(--vscode-statusBar-background, #007acc); color: var(--vscode-statusBar-foreground, #fff);
  overflow: hidden; white-space: nowrap;
}
#statusBar .seg { padding: 0 10px; display: flex; align-items: center; height: 100%; white-space: nowrap; }
#statusBar .seg.clickable { cursor: pointer; }
#statusBar .seg.clickable:hover { background: var(--vscode-statusBarItem-hoverBackground, rgba(255,255,255,.15)); }
#statusBar .grow { flex: 1; }

/* 浮动提示 */
#toast {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 200;
  background: var(--vscode-notificationBackground, #1e293b); color: var(--vscode-notificationForeground, #f1f5f9);
  padding: 8px 18px; border-radius: 8px; font-size: 12.5px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

/* ============ F16 页面外观：条纹（周期用 em，自动对齐行高并跟随字号缩放） ============ */
#editor.pat-lines {
  background-image: repeating-linear-gradient(to bottom,
    transparent 0, transparent calc(1.75em - 1px),
    var(--pat-color, rgba(127,127,127,.28)) calc(1.75em - 1px), var(--pat-color, rgba(127,127,127,.28)) 1.75em);
}
#editor.pat-grid {
  background-image:
    repeating-linear-gradient(to bottom,
      transparent 0, transparent calc(1.75em - 1px),
      var(--pat-color, rgba(127,127,127,.28)) calc(1.75em - 1px), var(--pat-color, rgba(127,127,127,.28)) 1.75em),
    repeating-linear-gradient(to right,
      transparent 0, transparent calc(1.6em - 1px),
      var(--pat-color, rgba(127,127,127,.22)) calc(1.6em - 1px), var(--pat-color, rgba(127,127,127,.22)) 1.6em);
}
#editor.pat-dots {
  background-image: radial-gradient(var(--pat-color, rgba(127,127,127,.4)) 1px, transparent 1px);
  background-size: 0.8em 0.8em;
}

/* ============ F16 页面设置面板（UI-09①） ============ */
#pagePanel {
  position: fixed; z-index: 90; width: 296px; max-width: calc(100vw - 12px); display: none;
  background: var(--vscode-editorWidget-background, #fff); color: var(--vscode-editorWidget-foreground, #1e293b);
  border: 1px solid var(--vscode-widget-border, #e2e8f0); border-radius: 10px;
  box-shadow: 0 16px 44px rgba(15,23,42,.26); padding: 12px; font-size: 12.5px;
}
#pagePanel .ptitle { font-size: 10.5px; color: var(--vscode-descriptionForeground, #94a3b8); font-weight: 700; letter-spacing: .06em; margin: 2px 0 6px; }
#pagePanel .pchips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
#pagePanel .pchips span {
  background: rgba(127,127,127,.08); border: 1px solid var(--vscode-panel-border, #e2e8f0);
  border-radius: 6px; padding: 3px 10px; cursor: pointer; user-select: none;
}
#pagePanel .pchips span:hover { background: var(--vscode-list-hoverBackground, rgba(127,127,127,.14)); }
#pagePanel .pchips span.on {
  background: var(--vscode-list-activeSelectionBackground, #eef2ff);
  color: var(--vscode-list-activeSelectionForeground, #3730a3); border-color: var(--vscode-focusBorder, #4f46e5); font-weight: 600;
}
#pagePanel .pcurrent { color: var(--vscode-descriptionForeground, #64748b); font-size: 11px; margin-bottom: 10px; }
#pagePanel .pswatches { display: flex; gap: 7px; align-items: center; margin-bottom: 10px; }
#pagePanel .pswatches span { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--vscode-panel-border, #cbd5e1); cursor: pointer; }
#pagePanel .pswatches span.on { outline: 2px solid var(--vscode-focusBorder, #4f46e5); outline-offset: 1px; }
#pagePanel .pswatches .custom-add { border-style: dashed; display: grid; place-items: center; color: var(--vscode-descriptionForeground, #94a3b8); font-size: 13px; }

  function dialog(title, fieldsHtml, buttons) {
    return new Promise(resolve => {
      dlgMask.innerHTML = '';
      const d = document.createElement('div'); d.className = 'dlg';
      d.innerHTML = '<h3>' + title + '</h3><div class="body">' + fieldsHtml + '</div>';
      const foot = document.createElement('div'); foot.className = 'foot';
      buttons.forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'btn' + (b.primary ? ' pri' : '');
        btn.textContent = b.text;
        btn.onclick = () => {
          if (b.closeOnly) { dlgMask.style.display = 'none'; resolve(null); return; }
          const values = {};
          $$('.dlg [data-field]').forEach(f => {
            values[f.dataset.field] = f.type === 'checkbox' ? f.checked : f.value;
          });
          if (b.validate && !b.validate(values)) { return; }
          dlgMask.style.display = 'none'; resolve(values);
        };
        foot.appendChild(btn);
      });
      d.appendChild(foot); dlgMask.appendChild(d); dlgMask.style.display = 'flex';
      const first = $('.dlg [data-field]'); if (first) { first.focus(); }
    });
  }

  function openLinkDialog() {
    const existing = closestTag('a');
    const selText = String(window.getSelection()).trim();
    const href0 = existing ? existing.getAttribute('href') || '' : '';
    dialog(existing ? '编辑链接' : '插入链接', [
      '<div class="frow"><label>显示文本</label><input data-field="text" value="' + escAttr(selText || (existing ? existing.textContent : '')) + '"></div>',
      '<div class="frow"><label>URL</label><input data-field="url" placeholder="https://…" value="' + escAttr(href0) + '"></div>',
      '<div class="frow"><label>悬停标题</label><input data-field="title" placeholder="title（可选）"></div>'
    ].join(''), [
      { text: '取消', closeOnly: true },
      { text: existing ? '更新' : '确定', primary: true, validate: v => !!v.url }
    ]).then(v => {
      if (!v) { return; }
      if (existing) {
        existing.setAttribute('href', v.url);
        existing.textContent = v.text || v.url;
        if (v.title) { existing.setAttribute('title', v.title); }
      } else {
        const a = document.createElement('a');
        a.setAttribute('href', v.url);
        if (v.title) { a.setAttribute('title', v.title); }

  function escAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  // ================= 加载 / 序列化 / 保存 =================
  function normalize() {
    // 游离文本包段落
    Array.prototype.slice.call(editor.childNodes).forEach(n => {
      if (n.nodeType === 3 && n.textContent.trim()) {
        const p = document.createElement('p'); p.textContent = n.textContent;
        editor.replaceChild(p, n);
      } else if (n.nodeType === 1 && ['b', 'i', 'u', 'span', 'a', 'code', 'del', 'mark'].indexOf(n.tagName.toLowerCase()) !== -1) {
        const p = document.createElement('p'); p.appendChild(n.cloneNode(true));
        editor.replaceChild(p, n);
      }
    });
    // 任务列表：补齐缺失的勾选框，并保证勾选字符与 data-checked 状态一致（Enter 续项复制结构后可能失配）
    $$('#editor li.md-task').forEach(li => {
      let cb = li.querySelector('.md-check');
      if (!cb) {
        cb = checkSpan(li.getAttribute('data-checked') === 'true');
        li.insertBefore(cb, li.firstChild);
      }
      const on = li.getAttribute('data-checked') === 'true';
      cb.textContent = on ? '☑' : '☐';
    });
  }
  function checkSpan(checked) {
    const s = document.createElement('span');
    s.className = 'md-check'; s.setAttribute('contenteditable', 'false');
    s.textContent = checked ? '☑' : '☐';
    return s;
  }

  function serialize() {
    normalize();
    return MD.domToMarkdown(editor);
  }
  function loadMarkdown(text) {
    editor.innerHTML = '';
    editor.appendChild(MD.blocksToDom(MD.parse(text)));
    resolveImages();
    updateStatus();
  }
  function currentText() {
    if (mode === 'wysiwyg') { return serialize(); }
    return srcTextarea.value;
  }
  function scheduleSave() {
    lastLocalEdit = Date.now();
    setSaveState('pending');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      setSaveState('saving');
      vscode.postMessage({ type: 'update', text: currentText() });
      sendOutline(); // 大纲联动（防抖后随保存节拍）
    }, 500);
  }
  function setSaveState(s) {
    saveState = s;
    const el = $('#sbSave');
    el.textContent = s === 'saved' ? '✓ 已保存' : s === 'saving' ? '保存中…' : '未保存';
  }

  function resolveImages() {
    const rels = [];
    $$('#editor img').forEach(img => {
      const ds = img.getAttribute('data-src') || '';
      if (ds && !/^(https?:|data:)/.test(ds) && rels.indexOf(ds) === -1) { rels.push(ds); }
    });
    if (rels.length) { vscode.postMessage({ type: 'resolveImages', paths: rels }); }
    else { applyImageMap({}); }
  }
  function applyImageMap(map) {
    $$('#editor img, #preview img').forEach(img => {
      const ds = img.getAttribute('data-src') || '';
      if (/^(https?:|data:)/.test(ds)) { img.src = ds; }
      else if (map[ds]) { img.src = map[ds]; }
      else { img.title = '图片丢失：' + ds + '（可重新定位或编辑链接）'; img.style.outline = '2px dashed #dc2626'; }
    });
  }

  // ================= 光标工具 =================
  function placeCaret(el, atEnd) {
    const r = document.createRange();
    r.selectNodeContents(el); r.collapse(!atEnd);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function topBlock() {
    const sel = window.getSelection();
    if (!sel.rangeCount) { return null; }
    let n = sel.getRangeAt(0).startContainer;
    if (n.nodeType === 3) { n = n.parentElement; }
    while (n && n !== editor) {
      if (n.parentElement === editor) { return n; }
      n = n.parentElement;
    }
    return null;
  }
  function closestTag(tag) {
    const sel = window.getSelection();
    if (!sel.rangeCount) { return null; }
    let n = sel.getRangeAt(0).startContainer;
    if (n.nodeType === 3) { n = n.parentElement; }
    while (n && n !== editor) {
      if (n.tagName && n.tagName.toLowerCase() === tag) { return n; }
      n = n.parentElement;
    }
    return null;
  }
  function caretContext() {
    const sel = window.getSelection();
    if (!sel.rangeCount || !sel.anchorNode) { return {}; }
    let n = sel.anchorNode;
    return {
      inTable: !!closestTag('table'),
      inPre: !!closestTag('pre'),
      inLi: !!closestTag('li')
    };
  }
  function insertAtCaret(node) {
    editor.focus();
    restoreSelIfNeeded();
    const sel = window.getSelection();
    if (sel.rangeCount && editor.contains(sel.anchorNode)) {
      const r = sel.getRangeAt(0);
      r.deleteContents();
      r.insertNode(node);
      r.setStartAfter(node); r.collapse(true);

  // ================= 光标保持（真实浏览器行为修复） =================

  // 双保险：① 弹层与 Ribbon 的 mousedown 阻止默认（不夺选区）；② 持续记录最后有效编辑区选区，插入前恢复。

  // ================= 块级命令 =================
  // 在光标处原位插入块级元素：
  // 空段落 → 原位替换；选区在块间隙（startContainer 为编辑器本身）→ 按 offset 插入对应位置；
  // 兜底追加到末尾。修复：此前块间隙场景表格被 appendChild 到文档末尾，造成"插入无反应 + 尾部堆积空表"。

    restoreSelIfNeeded();

    if (b) {
      if (b.tagName === 'P' && !b.textContent.trim()) {
        b.replaceWith(node); inserted = true; // 空段落 → 原位替换
      } else {
        b.after(node); inserted = true; // 非空段落 / 表格 / 代码块等结构块 → 插到该块之后（绝不嵌进内部）
      }
    } else if (s.rangeCount && editor.contains(s.anchorNode)) {
      try {
        const r = s.getRangeAt(0);
        r.deleteContents();
        r.insertNode(node); // 选区在块间隙（容器为编辑器本身）→ 按光标 offset 原位插入
        inserted = true;

  function requireWysiwyg(what) {

    if (t === tag) { return setBlockType('p'); }

  function insertTable(rows, cols, withHeader) {
    if (withHeader === undefined) { withHeader = settings.tableDefaultHeader; }
    const table = document.createElement('table');
    const mk = (tag, align) => {
      const c = document.createElement(tag);
      if (align) { c.setAttribute('data-align', align); }
      return c;
    };
    if (withHeader) {
      const thead = document.createElement('thead'); const tr = document.createElement('tr');
      for (let c = 1; c <= cols; c++) { tr.appendChild(mk('th')); tr.lastChild.textContent = '列' + c; }
      thead.appendChild(tr); table.appendChild(thead);
    }
    const tbody = document.createElement('tbody');
    const bodyRows = withHeader ? rows : rows; // rows 含表头
    for (let r = 0; r < bodyRows; r++) {
      const tr = document.createElement('tr');
      for (let c = 0; c < cols; c++) { tr.appendChild(mk('td')); }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);

    insertBlockAtCaret(table);
    editor.focus(); // 网格点击路径不经过 runCommand，必须显式夺回焦点，否则打字/Tab 落在按钮上
    const first = table.querySelector('th, td');
    if (first) { placeCaret(first, false); }
    scheduleSave();
  }

  function currentTable() {
    const b = topBlock();
    if (b && b.tagName === 'TABLE') { return b; }
    const sel = window.getSelection();
    if (!sel.rangeCount) { return null; }
    let n = sel.getRangeAt(0).startContainer;
    if (n.nodeType === 3) { n = n.parentElement; }
    while (n && n !== editor) {
      if (n.tagName === 'TABLE') { return n; }
      n = n.parentElement;
    }
    return null;
  }
  function currentCell() {
    const sel = window.getSelection();
    if (!sel.rangeCount) { return null; }
    let n = sel.getRangeAt(0).startContainer;
    if (n.nodeType === 3) { n = n.parentElement; }
    while (n && n !== editor) {
      if (n.tagName === 'TD' || n.tagName === 'TH') { return n; }
      n = n.parentElement;
    }
    return null;
  }
  function cellIndex(cell) {
    return Array.prototype.indexOf.call(cell.parentElement.children, cell);
  }
  function tableOp(op) {
    const table = currentTable();
    if (!table) { toast('光标不在表格内'); return; }
    const cell = currentCell();
    const colIdx = cell ? cellIndex(cell) : 0;
    const rowIdx = cell ? Array.prototype.indexOf.call(table.querySelectorAll('tr'), cell.parentElement) : 0;
    const rows = table.querySelectorAll('tr');
    switch (op) {
      case 'rowAbove': case 'rowBelow': {
        const tr = document.createElement('tr');
        const ref = rows[rowIdx];
        Array.prototype.forEach.call(ref.children, c => {
          const td = document.createElement(c.tagName === 'TH' && op === 'rowAbove' ? 'TH' : 'TD');
          if (c.getAttribute('data-align')) { td.setAttribute('data-align', c.getAttribute('data-align')); }
          tr.appendChild(td);
        });
        ref[op === 'rowAbove' ? 'before' : 'after'](tr);
        placeCaret(tr.children[Math.min(colIdx, tr.children.length - 1)], false);
        break;
      }
      case 'delRow': {
        if (rows.length <= 1) { return tableOp('delTable'); }
        const next = rows[rowIdx + 1] || rows[rowIdx - 1];
        rows[rowIdx].remove();
        if (next) { placeCaret(next.children[Math.min(colIdx, next.children.length - 1)], false); }
        break;
      }
      case 'colLeft': case 'colRight': {
        const at = op === 'colLeft' ? colIdx : colIdx + 1;
        rows.forEach(tr => {
          const td = document.createElement(tr.parentElement.tagName === 'THEAD' ? 'TH' : 'TD');
          tr.insertBefore(td, tr.children[at] || null);
        });
        break;
      }
      case 'delCol': {
        if (rows[0].children.length <= 1) { return tableOp('delTable'); }
        rows.forEach(tr => { if (tr.children[colIdx]) { tr.children[colIdx].remove(); } });
        break;
      }
      case 'alLeft': case 'alCenter': case 'alRight': {
        const a = op === 'alLeft' ? 'left' : op === 'alCenter' ? 'center' : 'right';
        rows.forEach(tr => {
          const c = tr.children[colIdx];
          if (c) { c.setAttribute('data-align', a); }
        });
        break;
      }
      case 'toggleHead': {
        const thead = table.querySelector('thead');
        if (thead) { // 表头 → 数据行：thead 首行 th 转 td 移入 tbody 首位
          const tr = thead.querySelector('tr');
          Array.prototype.forEach.call(tr.children, th => {
            const td = document.createElement('td');
            if (th.getAttribute('data-align')) { td.setAttribute('data-align', th.getAttribute('data-align')); }
            td.innerHTML = th.innerHTML; tr.replaceChild(td, th);
          });
          const tbody = table.querySelector('tbody') || table;
          tbody.insertBefore(tr, tbody.firstChild);
          thead.remove();
        } else { // 数据首行 → 表头
          const tbody = table.querySelector('tbody');
          if (!tbody || !tbody.firstChild) { return; }
          const thead2 = document.createElement('thead');
          const tr = tbody.firstChild;
          Array.prototype.forEach.call(tr.children, td => {
            const th = document.createElement('th');
            if (td.getAttribute('data-align')) { th.setAttribute('data-align', td.getAttribute('data-align')); }
            th.innerHTML = td.innerHTML; tr.replaceChild(th, td);
          });
          thead2.appendChild(tr);
          table.insertBefore(thead2, tbody);
        }
        break;
      }
      case 'delTable': table.remove(); break;
      case 'rowUp': case 'rowDown': {
        const tr = cell ? cell.parentElement : null;
        if (!tr) { break; }
        if (op === 'rowUp') {
          const prev = tr.previousElementSibling;
          if (prev && prev.tagName === 'TR') { tr.parentElement.insertBefore(tr, prev); }
        } else {
          const next = tr.nextElementSibling;
          if (next && next.tagName === 'TR') { tr.parentElement.insertBefore(next, tr); }
        }
        break;
      }
      case 'colMoveL': case 'colMoveR': {
        const at2 = colIdx + (op === 'colMoveL' ? -1 : 1);
        if (at2 < 0 || at2 >= rows[0].children.length) { break; }
        rows.forEach(tr => {
          const c = tr.children[colIdx], t = tr.children[at2];
          if (c && t) { tr.insertBefore(c, op === 'colMoveL' ? t : t.nextSibling); }
        });
        break;
      }
    }
    scheduleSave();
  }

      if (!hit.length) { return; }
      hit.sort((a, b) => score(a) - score(b));
      groups.push({ name: g.i18n ? T(g.i18n) : g.name, items: hit });
    });

  function aiRequest(cmd, text, instruction) {

  function openAiCard() {
    let card = $('#aiCard');

      card = document.createElement('div'); card.id = 'aiCard';
      card.innerHTML = [
        '<div class="ai-h"><span class="ai-title"></span><span class="ai-meta"></span><span style="flex:1"></span><span class="ai-stop" title="关闭">✕</span></div>',

        '<button class="btn pri ai-act" data-a="accept"></button>',

        b.onclick = () => {
          const a = b.dataset.a;
          if (a === 'discard') { card.style.display = 'none'; aiState.open = false; return; }
          if (a === 'retry') { return aiRequest(aiState.cmd, aiState.origText, aiState.instruction); }
          if (a === 'append') {
            const v = card.querySelector('.ai-instr').value.trim();
            if (!v) { return; }
            return aiRequest('custom', aiState.origText, aiState.instruction ? aiState.instruction + '；' + v : v);
          }

      });

        if (e.key === 'Enter') {
          e.preventDefault();
          const v = e.target.value.trim();

        }

  function acceptAi() {
    const card = $('#aiCard');
    card.style.display = 'none';
    aiState.open = false;
    if (aiState.mode === 'insert') {
      // outline / continue：直接插入结果（大纲逐行 ### 解析为块）
      const lines = aiState.result.trim().split('\n').filter(l => l.trim());
      if (aiState.cmd === 'outline') {
        const frag = MD.blocksToDom(MD.parse(lines.join('\n')));
        insertNodesAtCaret(frag);
      } else {
        const frag = MD.blocksToDom(MD.parse(aiState.result.trim()));
        insertNodesAtCaret(frag);
      }
      scheduleSave();
      return;
    }
    // replace：替换保存的选区 range
    const r = aiState.range;
    if (r) {
      try {
        r.deleteContents();
        const frag = MD.blocksToDom(MD.parse(aiState.result.trim()));
        const nodes = [];
        Array.prototype.forEach.call(frag.childNodes, n => nodes.push(n));
        nodes.forEach(n => r.insertNode(n));
      } catch (e) {
        insertNodesAtCaret(MD.blocksToDom(MD.parse(aiState.result.trim())));
      }
      scheduleSave();
    }
  }

  // ================= F14 面包屑（标题路径） =================
  function buildCrumb() {
    const c = document.createElement('div'); c.id = 'crumb';

  function updateCrumb() {
    const c = $('#crumb');
    if (!c) { return; }
    if (mode !== 'wysiwyg') { c.style.display = 'none'; return; }
    c.style.display = 'flex';
    // 当前块之前（含所在标题）的标题链：遍历块维护层级栈，到达当前块时栈即路径
    const cur = topBlock();
    const stack = [];
    const kids = editor.children || [];
    for (let k = 0; k < kids.length; k++) {
      const el = kids[k];
      if (el.tagName && /^H[1-6]$/.test(el.tagName)) {
        const lv = +el.tagName[1];
        while (stack.length && stack[stack.length - 1].level >= lv) { stack.pop(); }
        stack.push({ level: lv, el: el });
      }
      if (el === cur) { break; }
    }
    if (!stack.length) {
      const h1 = $('#editor h1');
      c.innerHTML = h1 ? '<span class="crumb-item">' + MD.escapeHtml(h1.textContent.trim()) + '</span>' : '';
      return;
    }
    c.innerHTML = '';
    stack.forEach((it, i) => {
      if (i) { const sep = document.createElement('span'); sep.className = 'crumb-sep'; sep.textContent = '›'; c.appendChild(sep); }
      const item = document.createElement('span'); item.className = 'crumb-item'; item.textContent = it.el.textContent.trim();
      item.onclick = () => { placeCaret(it.el, true); try { it.el.scrollIntoView({ block: 'center' }); } catch (e) { /* */ } };
      c.appendChild(item);
    });
  }

  // ================= F02 选区级字体（行内 span 持久化） =================
  function applyFontToSelection() {
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) { return false; }
    const e = settings.editor || {};
    const stack = [e.fontFamilyLatin, e.fontFamilyCJK].filter(Boolean).map(f => '"' + f + '"');
    if (!stack.length) { toast(lang === 'zh' ? '请先选择字体' : 'Choose a font first'); return false; }
    const span = document.createElement('span');
    span.setAttribute('style', 'font-family:' + stack.join(', '));
    try { sel.getRangeAt(0).surroundContents(span); }
    catch (err) {
      const r = sel.getRangeAt(0);
      const frag = r.extractContents();
      span.appendChild(frag);
      r.insertNode(span);
    }
    scheduleSave();
    toast(lang === 'zh' ? '字体已应用于选中文字（随文档保存）' : 'Font applied to selection (persisted)');
    return true;

  // ================= 命令分发 =================
  function runCommand(cmd) {
    editor.focus();
    switch (cmd) {
      case 'bold': execSimple('bold'); break;
      case 'italic': execSimple('italic'); break;
      case 'underline': execSimple('underline'); break;
      case 'strike': execSimple('strikeThrough'); break;
      case 'highlight': toggleWrap('mark'); break;
      case 'incode': toggleWrap('code'); break;
      case 'h1': case 'h2': case 'h3': case 'h4': case 'h5': case 'h6': setBlockType(cmd); break;
      case 'p': setBlockType('p'); break;
      case 'quote': setBlockType('quote'); break;
      case 'hr': insertHR(); break;
      case 'ul': case 'ol': case 'task': {
        const b = topBlock();
        const t = b ? b.tagName.toLowerCase() : '';
        const ordered = cmd === 'ol';
        if ((t === 'ul' && !ordered) || (t === 'ol' && ordered) || (cmd === 'task' && t === 'ul')) {
          // 再点同类型列表 → 转回段落
          if (b) { listToParas(b); }
        } else { toggleList(ordered, cmd === 'task'); }
        break;
      }
      case 'codeblock': insertCodeBlock(); break;
      case 'table': {
        const btn = $('.rtab[data-panel="rp-ins"]');
        showTablePicker(btn || editorWrap);
        break;
      }
      case 'image': openImageDialog(); break;
      case 'link': openLinkDialog(); break;
      case 'datetime': insertDatetime(); break;
      case 'emoji': showEmojiPanel($('.rbtn[data-cmd="emoji"]') || editorWrap); break;
      case 'mWysiwyg': setMode('wysiwyg'); break;
      case 'mSource': setMode('source'); break;
      case 'mSplit': setMode('split'); break;
      case 'zoomIn': zoomFont(1); break;
      case 'zoomOut': zoomFont(-1); break;
      case 'pageSetup': showPagePanel($('.rbtn[data-cmd="pageSetup"]') || editorWrap); break;
      case 'cycleLang': cycleLanguage(); break;
      case 'find': openFind(false); break;
      case 'replace': openFind(true); break;
      case 'exportHtml': exportHtml(); break;
      case 'exportPdf': exportPdf(); break;
      case 'toc': case 'insertTOC': insertTOC(); break;
      case 'panelInfo': insertPanel('info'); break;
      case 'panelTip': insertPanel('tip'); break;
      case 'panelWarning': insertPanel('warning'); break;
      case 'panelError': insertPanel('error'); break;
      case 'footnote': case 'insertFootnote': insertFootnote(); break;
      case 'aiOutline': {
        hideSlashMenu();
        if (!aiAvailable()) { toast(T('aiDisabled')); break; }
        const b = topBlock();
        const ctxText = b ? (b.tagName === 'H1' || b.tagName === 'H2' || b.tagName === 'H3' ? b.textContent : '') : '';
        const prevHead = $$('#editor h1,#editor h2,#editor h3').map(h => h.textContent).join(' > ');
        aiState.range = null;
        aiRequest('outline', (ctxText ? '本节标题：' + ctxText + '\n' : '') + '文档标题脉络：' + (prevHead || '（空）') + '\n\n本节现有正文：' + (b ? b.textContent.slice(0, 500) : ''), '');

      case 'redo': execSimple('redo'); break;

  let zoom = 100;
  function zoomFont(d) {
    zoom = Math.max(75, Math.min(200, zoom + d * 10));
    editor.style.fontSize = (15 * zoom / 100).toFixed(1) + 'px';
    $$('.fddl').forEach(f => { if (f.textContent.indexOf('%') !== -1) { f.textContent = zoom + '%'; } });

  // ================= 键盘：速记 / Tab / Enter / Backspace / 快捷键 =================
  function onKeydown(e) {

      if (e.key === 'Tab' && document.activeElement === srcTextarea) {
        e.preventDefault();

      }
      return;
    }
    // 斜杠菜单导航
    if (slashState.open) {
      if (e.key === 'ArrowDown') { e.preventDefault(); slashState.active = Math.min(slashState.active + 1, slashState.items.length - 1); highlightSlash(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); slashState.active = Math.max(slashState.active - 1, 0); highlightSlash(); return; }
      if (e.key === 'Enter') { e.preventDefault(); const li = slashState.items[slashState.active]; if (li) { execSlashItem(li.dataset.cmd); } return; }
      if (e.key === 'Escape') { e.preventDefault(); hideSlashMenu(); return; }
    }
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !e.shiftKey && !e.altKey) {
      const map = { b: 'bold', i: 'italic', k: 'link', z: 'undo', y: 'redo', u: 'underline', f: 'find', h: 'replace' };
      if (map[e.key.toLowerCase()]) { e.preventDefault(); return runCommand(map[e.key.toLowerCase()]); }
      if (/^[1-6]$/.test(e.key)) { e.preventDefault(); return setBlockType('h' + e.key); }
    }
    if (mod && e.shiftKey) {
      // Shift 按下时 e.key 为大写/符号（如 Shift+8 → '*'），字母统一小写匹配，数字用 e.code 兜底
      const k = e.key.toLowerCase();
      const map = { s: 'strike', k: 'codeblock', q: 'quote' };
      const digitCmd = e.code && { Digit7: 'ol', Digit8: 'ul', Digit9: 'task' }[e.code];
      const cmd = map[k] || digitCmd;
      if (cmd) { e.preventDefault(); return runCommand(cmd); }
    }
    if (mod && e.altKey) {
      if (e.key.toLowerCase() === 't') { e.preventDefault(); return runCommand('table'); }
      if (e.key.toLowerCase() === 'v') { e.preventDefault(); return runCommand('toggleMode'); }

    if (e.key === 'Tab') {
      e.preventDefault();
      if (ctx.inTable) { return tableTab(e.shiftKey); }
      if (ctx.inPre) { return insertAtCaret(document.createTextNode('  ')); }
      const li = closestTag('li');
      if (li) { return e.shiftKey ? outdentListItem(li) : indentListItem(li); }
      return;
    }
    // Enter：代码块内统一插入换行符（浏览器默认可能插 <br>，序列化会丢失）
    if (e.key === 'Enter' && ctx.inPre) {

    if (e.key === 'Enter' && !e.shiftKey) {

      if (li) {

        const isEmpty = body ? !body.textContent.trim() : !li.textContent.trim();
        if (isEmpty && !li.querySelector('ul,ol')) {

        setTimeout(() => {

      }
      return; // 默认行为（浏览器在 li 内续项）
    }
    // Backspace：行首空项转段落（嵌套列表内的 p 不能留在 ul 里，否则序列化时被静默丢弃）
    if (e.key === 'Backspace') {
      const li = closestTag('li');
      if (li) {
        const body = li.querySelector('.li-body');
        const isEmpty = body ? !body.textContent.trim() : !li.textContent.trim();
        const caretAtStart = caretAtLiStart();
        if (isEmpty && !li.querySelector('ul,ol')) {
          e.preventDefault();
          const p = document.createElement('p'); p.innerHTML = '<br>';
          const list = li.parentElement;
          if (list.parentElement === editor) {

    if (e.key === ' ' && !mod) {
      const sel = window.getSelection();
      if (sel.rangeCount && sel.isCollapsed && sel.anchorNode && sel.anchorNode.nodeType === 3) {

        if (b && b.textContent === before) {
          const m = before.match(/^(#{1,6}|>|[-*+]|1\.|\[\]|\[ \]|- \[ \]|- \[x\])$/i);
          if (m) {
            e.preventDefault();
            if (/^#/.test(m[1])) { b.innerHTML = ''; return setBlockType('h' + m[1].length); }
            if (m[1] === '>') { b.innerHTML = ''; return setBlockType('quote'); }
            if (m[1] === '[]' || m[1] === '[ ]' || /^- \[ \]$/i.test(m[1])) { b.innerHTML = ''; return buildListAt(b, false, true); }
            if (/^-/.test(m[1])) { b.innerHTML = ''; return buildListAt(b, false, false); }
            if (m[1] === '1.') { b.innerHTML = ''; return buildListAt(b, true, false); }

  }
  function caretAtLiStart() {

  function insertAtTextarea(ta, text) {

    ta.selectionStart = ta.selectionEnd = s + text.length;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function indentListItem(li) {
    const prev = li.previousElementSibling;
    if (!prev || prev.tagName !== 'LI') { return; }
    let sub = prev.querySelector(':scope > ul, :scope > ol');
    if (!sub) {
      sub = document.createElement(li.parentElement.tagName.toLowerCase());
      prev.appendChild(sub);
    }
    sub.appendChild(li);

  }
  function outdentListItem(li) {
    const sub = li.parentElement;

    if (!outerLi || outerLi.tagName !== 'LI') {

      const p = document.createElement('p');
      const body = li.querySelector('.li-body');
      p.innerHTML = body ? body.innerHTML : li.innerHTML;
      const list = sub;
      if (li.nextElementSibling || li.previousElementSibling) { list.after(p); }
      else { list.replaceWith(p); return scheduleSave(); }
      li.remove();
      if (!list.children.length) { list.remove(); }
      placeCaret(p, true);
      return scheduleSave();
    }
    outerLi.after(li);
    scheduleSave();
  }

  // ================= 表格键盘导航 =================
  function tableTab(shift) {
    const cell = currentCell();
    if (!cell) { return; }
    const table = currentTable();
    const rows = table.querySelectorAll('tr');
    const r = Array.prototype.indexOf.call(rows, cell.parentElement);
    const c = cellIndex(cell);
    let nr = r, nc = c + (shift ? -1 : 1);
    if (nc >= cell.parentElement.children.length) { nc = 0; nr++; }
    if (nc < 0) { nr--; if (nr < 0) { return; } nc = rows[nr].children.length - 1; }
    if (nr >= rows.length) {
      // 末格 Tab：自动追加新行（Word 同款）
      tableOp('rowBelow');
      const rows2 = table.querySelectorAll('tr');
      placeCaret(rows2[rows2.length - 1].children[0], false);
      return;
    }
    placeCaret(rows[nr].children[nc] || rows[nr].children[0], false);
  }
  function tableEnter() {
    const cell = currentCell();
    if (!cell) { return; }
    const table = currentTable();
    const rows = table.querySelectorAll('tr');
    const r = Array.prototype.indexOf.call(rows, cell.parentElement);
    const c = cellIndex(cell);
    const nr = Math.min(r + 1, rows.length - 1);
    placeCaret(rows[nr].children[c] || rows[nr].children[0], false);
  }

  // ================= 粘贴（图片落盘 / md 源码渲染 / HTML 清洗） =================
  function onPaste(e) {
    if (mode !== 'wysiwyg') { return; }
    const cd = e.clipboardData;
    if (!cd) { return; }
    const ctx = caretContext();
    // 图片（F06）：代码块内不允许（序列化不产生引用，会留下孤儿文件误导用户）
    const items = cd.items || [];
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        const f = items[i].getAsFile();
        if (f) {
          e.preventDefault();
          if (ctx.inPre) { toast('代码块内不能插入图片，请先移出代码块'); return; }
          sendImageFile(f); return;
        }
      }
    }
    const text = cd.getData('text/plain');
    const html = cd.getData('text/html');
    const mdLike = /(^|\n)\s*(#{1,6} |```|\|.*\||[-*+] \[|> |- |\d+\. )/.test(text);
    // 结构化上下文（单元格 / 列表项 / 代码块）内：粘贴统一为纯文本（块级 DOM 嵌进行内上下文会丢结构）
    if (ctx.inPre) {
      if (text) { e.preventDefault(); insertAtCaret(document.createTextNode(text)); }
      return;
    }
    if ((ctx.inTable || ctx.inLi) && text) {
      e.preventDefault();
      insertAtCaret(document.createTextNode(text.replace(/\s*\n+\s*/g, ' ')));
      return;
    }
    // Markdown 源码粘贴自动渲染（即使剪贴板同时带 HTML——如从 VS Code 原生编辑器复制）
    if (text && mdLike) {
      e.preventDefault();
      const frag = MD.blocksToDom(MD.parse(text));
      insertNodesAtCaret(frag);
      return;
    }
    if (html && !/^\s*$/.test(html)) {
      e.preventDefault();
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      // 智能粘贴增强（F11）：识别 Word 的 mso-list 段落并还原为列表
      tmp.querySelectorAll('p[style*="mso-list"]').forEach(p => {
        const lm = /mso-list:\s*l(\d+)(?:\s+level(\d+))?/.exec(p.getAttribute('style') || '');
        if (!lm) { return; }
        const level = Math.max(1, Math.min(3, parseInt(lm[2] || '1', 10)));
        const li = document.createElement('li');
        li.innerHTML = p.innerHTML;
        li.setAttribute('data-mdw-level', String(level));
        const ul = document.createElement('ul');
        ul.appendChild(li);
        p.replaceWith(ul);
      });
      // 清洗：去脚本样式与内联样式，去 data: 内嵌图
      tmp.querySelectorAll('script,style,meta,link').forEach(n => n.remove());
      // 合并连续的 Word 列表 ul 为嵌套结构（按 data-mdw-level）
      let listRoot = null; let listStack = [];
      Array.prototype.slice.call(tmp.children).forEach(el => {
        const li = el.tagName === 'UL' ? el.querySelector('li[data-mdw-level]') : null;
        if (!li) { listRoot = null; listStack = []; return; }
        const lvl = Math.max(1, +li.getAttribute('data-mdw-level') || 1);
        if (!listRoot) { listRoot = el; listStack = [{ lvl: 1, ul: el }]; li.removeAttribute('data-mdw-level'); return; }
        while (listStack.length > 1 && listStack[listStack.length - 1].lvl >= lvl) { listStack.pop(); }
        const top = listStack[listStack.length - 1];
        li.removeAttribute('data-mdw-level');
        if (lvl > top.lvl) {
          const sub = document.createElement('ul');
          (top.ul.lastElementChild || top.ul).appendChild(sub);
          sub.appendChild(li);
          listStack.push({ lvl: lvl, ul: sub });
        } else {
          top.ul.appendChild(li);
        }
        el.remove();
      });
      tmp.querySelectorAll('*').forEach(n => {
        n.removeAttribute('style'); n.removeAttribute('class'); n.removeAttribute('id');
        n.removeAttribute('data-mdw-level');
        if (n.tagName === 'IMG' && /^data:/.test(n.getAttribute('src') || '')) { n.replaceWith(document.createTextNode('[图片]')); }
      });
      const blocks = MD.domToBlocks(tmp);
      const frag = MD.blocksToDom(blocks);
      insertNodesAtCaret(frag);
      return;
    }
    if (text) {
      e.preventDefault();
      const lines = text.split(/\r?\n/);
      if (lines.length > 1) {
        insertNodesAtCaret(MD.blocksToDom(MD.parse(text)));
      } else {
        insertAtCaret(document.createTextNode(text.replace(/\s+$/, '')));
      }
    }
  }
  function insertNodesAtCaret(frag) {
    editor.focus();

    const b = topBlock();

    if (b && b.tagName === 'P' && !b.textContent.trim()) {
      b.replaceWith(frag); // 空段落原位替换（fragment 展开保序）
    } else if (b) {
      b.after(frag); // 当前块之后（保序）

  function onDrop(e) {

  // ================= 模式（F01） =================
  function setMode(m) {

  function resolvePreviewImages() {

  // ================= 状态栏 =================
  function updateStatus() {
    // 位置

    if (b) {
      const idx = Array.prototype.indexOf.call(editor.children, b) + 1;
      const sel2 = window.getSelection();
      const col = (sel2 && sel2.anchorNode && sel2.anchorNode.nodeType === 3) ? sel2.anchorOffset + 1 : 1;
      $('#sbPos').textContent = '块 ' + idx + ' · 列 ' + col;
    } else {
      const ta = srcTextarea;
      const upto = ta.value.slice(0, ta.selectionStart).split('\n');

    }

    if (mode === 'wysiwyg') { words = editor.textContent.replace(/\s/g, '').length; }

  }

  let toastTimer = null;
  function toast(msg) {

  // ================= 事件绑定 =================
  function bindEvents() {

    });
    dlgMask.addEventListener('mousedown', e => { if (e.target === dlgMask) { dlgMask.style.display = 'none'; } });

    // 光标保持：记录编辑区选区 + 防止 Ribbon/弹层夺走选区（真实浏览器行为）
    trackSelection();
    guardLayersFromStealingSelection();

    // 源码模式：在 VS Code 原生编辑器中打开（Beside 并排，不替换本编辑器）
    const nativeBtn = $('#openNativeBtn');
    if (nativeBtn) { nativeBtn.onclick = () => vscode.postMessage({ type: 'openNative' }); }
  }

  // ================= 宿主消息 =================
  window.addEventListener('message', e => {
    const msg = e.data;
    switch (msg.type) {
      case 'init':
        settings = Object.assign(settings, msg.settings || {});
        if (!settings.page) { settings.page = { size: 'fit', customWidth: 794, background: 'auto', pattern: 'none' }; }
        if (!settings.editor) { settings.editor = {}; }
        applyLanguage();
        applyPageSettings();
        applyFontVars();
        loadMarkdown(msg.text || '');
        sendOutline();
        setMode(settings.defaultMode === 'source' || settings.defaultMode === 'split' ? settings.defaultMode : 'wysiwyg');
        if (settings.defaultMode === 'wysiwyg') { placeCaret(editor, false); }
        setSaveState('saved');
        break;
      case 'saved':
        setSaveState('saved');
        if (externalStale) {
          externalStale = false;
          toast('⚠ 文件曾在外部被修改，本次保存以本地内容为准（如需找回外部改动请用源码模式查看历史）');
        }
        break;
      case 'externalChange':
        if (Date.now() - lastLocalEdit < 2500) {
          // 本端刚有编辑：不能立即重载（会打断输入并丢本地改动），但必须记住——
          // 否则下一次全量保存会静默覆盖外部修改
          externalStale = true;
          return;
        }
        if (mode === 'wysiwyg') { loadMarkdown(msg.text || ''); }
        else { srcTextarea.value = msg.text || ''; if (mode === 'split') { updatePreview(); } }
        toast('文档已在外部修改，已重新加载');
        setSaveState('saved');
        break;
      case 'imageSaved': onImageSaved(msg); break;
      case 'imageMap': applyImageMap(msg.map || {}); break;
      case 'gotoHeading': gotoHeading(msg.text); break;
      case 'aiChunk':
        if (msg.id === aiState.id) { aiState.result += msg.delta || ''; paintAiChunk(); }
        break;
      case 'aiDone':
        if (msg.id === aiState.id) {
          aiState.busy = false;
          const card = $('#aiCard');
          if (card) {
            card.querySelector('.ai-meta').textContent = aiState.result.length + ' chars';
            card.querySelectorAll('.ai-act').forEach(b => { b.disabled = false; });
          }
          if (msg.empty) { card.style.display = 'none'; toast('AI 未返回内容'); }
        }
        break;
      case 'aiError':
        if (msg.id === aiState.id) {
          aiState.busy = false;
          const card = $('#aiCard');
          if (card) { card.style.display = 'none'; }
          if (msg.error === 'no-model' || msg.error === 'no-lm') { toast(T('aiLogin')); }
          else if (msg.error === 'disabled') { toast(T('aiDisabled')); }
          else { toast('AI 出错：' + msg.error); }
        }
        break;
      case 'command':
        if (msg.cmd === 'insertTable') { showTablePicker(editorWrap); }
        else if (msg.cmd === 'insertImage') { openImageDialog(); }
        else if (msg.cmd) { runCommand(msg.cmd); } // toggleMode/pageSetup/exportHtml/toc/panelInfo 等统一分发
        break;
      case 'info':
        toast(msg.text || '');
        break;
      default: break;
    }
  });

  // ================= 启动 =================
  buildApp();
  vscode.postMessage({ type: 'ready' });
})();
</script>
